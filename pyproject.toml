[project]
name = "unified-async-llm-client"
version = "0.1.0"
description = "Cliente asíncrono unificado para OpenAI y Anthropic: Pre-entrega 1 de AI Engineering (Coderhouse)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6,<3",
    "anyio>=4.16,<5",
    "httpx2>=2.16,<3",
    "openai>=3.46,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF", "SIM"]
