[project]
name = "coderhouse-ai-engineering"
version = "0.1.0"
description = "Cliente LLM asíncrono y pipeline de extracción con LangChain: pre-entregas de AI Engineering (Coderhouse)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6,<3",
    "anyio>=4.16,<5",
    "httpx2>=2.16,<3",
    "langchain-anthropic>=1.7,<2",
    "langchain-core>=1.7,<2",
    "langchain-openai>=1.7,<2",
    "openai>=3.46,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# LangChain's ExponentialJitterParams only documents `initial`, which tenacity 9.2 deprecates.
filterwarnings = ["ignore:The 'initial' parameter is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF", "SIM"]
